{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="{% static 'manifest.webmanifest' %}">
<link rel="icon" href="{% static 'icons/favicon.ico' %}" sizes="any">
<link rel="icon" type="image/png" href="{% static 'icons/favicon-32.png' %}" sizes="32x32">
<link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
<meta name="theme-color" content="#1d2b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Маджонг</title>
<style>
  :root {
    /* Зона заголовка standalone-вікна (macOS window-controls-overlay) або
       safe-area на iOS. У звичайній вкладці обидва = 0. */
    --safe-top: max(env(safe-area-inset-top, 0px), env(titlebar-area-height, 0px));
  }
  body {
    margin: 0; height: 100vh; box-sizing: border-box; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    background: #1d2b1f; color: #eee; font-family: system-ui, sans-serif;
    padding-top: var(--safe-top);
    /* Смуга заголовка перекриває контент у standalone-вікні — дозволяємо
       тягати вікно за неї, а інтерактивні елементи виключаємо нижче */
    -webkit-app-region: drag;
  }
  #toolbar {
    display: flex; gap: 8px; align-items: center; padding: 10px;
    height: 36px; box-sizing: content-box; flex: none;
  }
  #toolbar button {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; font-size: 15px; font-weight: 500;
    border: 0; border-radius: 6px;
    background: #3a5a40; color: #fff; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: background .15s ease;
    -webkit-app-region: no-drag;
  }
  #toolbar button:hover { background: #4c7454; }
  /* Фіксована висота (вьюпорт мінус тулбар, статус-рядок і зона заголовка),
     щоб розмір контейнера не залежав від канваса — інакше Scale.FIT
     масштабує ривками */
  #game-container {
    width: 100%; max-width: 800px;
    height: calc(100vh - 56px - 36px - var(--safe-top)); flex: none;
    -webkit-app-region: no-drag;
  }
  /* Один рядок під полем: статус партії, рівень складності, довічна
     зведена статистика — усе, що раніше було праворуч від кнопок */
  #status-bar {
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 4px 14px;
    height: 20px; padding: 8px 10px; box-sizing: content-box; flex: none;
    overflow: hidden;
    -webkit-app-region: no-drag;
  }
  #status {
    display: inline-flex; align-items: center; gap: 6px; font-size: 15px;
  }
  #difficulty-label {
    display: inline-flex; align-items: center;
    font-size: 14px; color: #cde;
  }
  #stats-summary {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; color: #cde;
  }
  #stats-modal, #newgame-modal {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    align-items: center; justify-content: center;
    -webkit-app-region: no-drag;
    animation: stats-overlay-in .18s ease;
  }
  #stats-modal.open, #newgame-modal.open { display: flex; }
  #stats-modal .panel, #newgame-modal .panel {
    background: #24352a; border-radius: 10px; padding: 24px 28px;
    min-width: 260px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.06);
    animation: stats-panel-in .2s ease;
    max-height: calc(100vh - 40px); overflow-y: auto;
  }
  #stats-modal h2, #newgame-modal h2 {
    margin: 0 0 20px; font-size: 20px; text-align: center;
  }
  #stats-modal dl {
    display: grid; grid-template-columns: auto auto; gap: 9px 20px;
    margin: 0 0 12px; font-size: 14px;
  }
  #stats-modal dt { color: #9bb; }
  #stats-modal dd { margin: 0; text-align: right; font-weight: 600; }
  #stats-modal .actions, #newgame-modal .actions {
    margin-top: -4px; padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    text-align: center;
  }
  #stats-modal button, #newgame-modal button {
    padding: 6px 20px; font-size: 14px; font-weight: 500;
    border: 0; border-radius: 6px; min-width: 120px;
    background: #3a5a40; color: #fff; cursor: pointer;
    transition: background .15s ease;
  }
  #stats-modal button:hover, #newgame-modal button:hover { background: #4c7454; }
  #newgame-modal .levels {
    display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px;
  }
  #newgame-modal .levels button {
    padding: 10px 20px; font-size: 15px; font-weight: 500;
    border: 0; border-radius: 6px; min-width: 180px;
    background: #3a5a40; color: #fff; cursor: pointer;
    transition: background .15s ease;
  }
  #newgame-modal .levels button:hover { background: #4c7454; }
  #newgame-modal .levels button.selected {
    background: #6ea56f; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.3) inset;
  }
  #stats-modal .level-block { margin-bottom: 22px; }
  #stats-modal .level-block h3 {
    margin: 0 0 10px; font-size: 15px; color: #cde;
  }
  #stats-modal .level-block.current h3 { color: #fff; }
  #stats-modal .level-block.current h3::after { content: ' ← поточний'; font-size: 12px; color: #9bb; }
  @keyframes stats-overlay-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes stats-panel-in {
    from { opacity: 0; transform: translateY(6px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #stats-modal, #stats-modal .panel, #newgame-modal, #newgame-modal .panel { animation: none; }
  }
</style>
</head>
<body>
<div id="toolbar">
  <button id="btn-new">🆕 Нова гра</button>
  <button id="btn-hint">💡 Підказка</button>
  <button id="btn-undo">↩️ Скасувати</button>
  <button id="btn-stats">📊 Статистика</button>
</div>
<div id="game-container"></div>
<div id="status-bar">
  <span id="status"></span>
  <span id="difficulty-label"></span>
  <span id="stats-summary"></span>
</div>
<div id="newgame-modal">
  <div class="panel">
    <h2>🆕 Нова гра</h2>
    <div class="levels">
      <button data-level="easy">😌 Легко</button>
      <button data-level="normal">🙂 Нормально</button>
      <button data-level="hard">😈 Складно</button>
    </div>
    <div class="actions">
      <button id="btn-newgame-close">✖ Закрити</button>
    </div>
  </div>
</div>
<div id="stats-modal">
  <div class="panel">
    <h2 id="stats-title">📊 Статистика</h2>
    <div id="stats-levels"></div>
    <div class="actions">
      <button id="btn-stats-new">🆕 Нова гра</button>
      <button id="btn-stats-close">✖ Закрити</button>
    </div>
  </div>
</div>
<script src="{% static 'vendor/phaser.min.js' %}"></script>
<script type="module" src="{% static 'game/main.js' %}"></script>
</body>
</html>
