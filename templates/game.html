{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маджонг</title>
<style>
  body {
    margin: 0; height: 100vh; overflow: hidden; display: flex;
    flex-direction: column; align-items: center; background: #1d2b1f;
    color: #eee; font-family: system-ui, sans-serif;
  }
  #toolbar {
    display: flex; gap: 8px; align-items: center; padding: 10px;
    height: 36px; box-sizing: content-box; flex: none;
  }
  #toolbar button {
    padding: 8px 14px; font-size: 15px; border: 0; border-radius: 6px;
    background: #3a5a40; color: #fff; cursor: pointer;
  }
  #toolbar button:hover { background: #4c7454; }
  #status { margin-left: 12px; font-size: 15px; }
  /* Фіксована висота (вьюпорт мінус тулбар), щоб розмір контейнера
     не залежав від канваса — інакше Scale.FIT масштабує ривками */
  #game-container {
    width: 100%; max-width: 800px; height: calc(100vh - 56px); flex: none;
  }
</style>
</head>
<body>
<div id="toolbar">
  <button id="btn-new">Нова гра</button>
  <button id="btn-hint">Підказка</button>
  <button id="btn-undo">Скасувати</button>
  <span id="status"></span>
</div>
<div id="game-container"></div>
<script src="{% static 'vendor/phaser.min.js' %}"></script>
<script type="module" src="{% static 'game/main.js' %}"></script>
</body>
</html>
