{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="{% static 'manifest.webmanifest' %}">
<meta name="theme-color" content="#1d2b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Маджонг</title>
<style>
  :root {
    /* Зона заголовка standalone-вікна (macOS window-controls-overlay) або
       safe-area на iOS. У звичайній вкладці обидва = 0. */
    --safe-top: max(env(safe-area-inset-top, 0px), env(titlebar-area-height, 0px));
  }
  body {
    margin: 0; height: 100vh; box-sizing: border-box; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    background: #1d2b1f; color: #eee; font-family: system-ui, sans-serif;
    padding-top: var(--safe-top);
    /* Смуга заголовка перекриває контент у standalone-вікні — дозволяємо
       тягати вікно за неї, а інтерактивні елементи виключаємо нижче */
    -webkit-app-region: drag;
  }
  #toolbar {
    display: flex; gap: 8px; align-items: center; padding: 10px;
    height: 36px; box-sizing: content-box; flex: none;
  }
  #toolbar button {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; font-size: 15px; font-weight: 500;
    border: 0; border-radius: 6px;
    background: #3a5a40; color: #fff; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: background .15s ease;
    -webkit-app-region: no-drag;
  }
  #toolbar button:hover { background: #4c7454; }
  #status {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: 12px; font-size: 15px;
  }
  #stats-summary {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: 12px; font-size: 14px; color: #cde;
  }
  /* Фіксована висота (вьюпорт мінус тулбар і зона заголовка), щоб розмір
     контейнера не залежав від канваса — інакше Scale.FIT масштабує ривками */
  #game-container {
    width: 100%; max-width: 800px;
    height: calc(100vh - 56px - var(--safe-top)); flex: none;
    -webkit-app-region: no-drag;
  }
  #stats-modal {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    align-items: center; justify-content: center;
    -webkit-app-region: no-drag;
    animation: stats-overlay-in .18s ease;
  }
  #stats-modal.open { display: flex; }
  #stats-modal .panel {
    background: #24352a; border-radius: 10px; padding: 24px 28px;
    min-width: 260px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.06);
    animation: stats-panel-in .2s ease;
  }
  #stats-modal h2 {
    margin: 0 0 20px; font-size: 20px; text-align: center;
  }
  #stats-modal dl {
    display: grid; grid-template-columns: auto auto; gap: 9px 20px;
    margin: 0 0 24px; font-size: 14px;
  }
  #stats-modal dt { color: #9bb; }
  #stats-modal dd { margin: 0; text-align: right; font-weight: 600; }
  #stats-modal .actions {
    margin-top: -4px; padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    text-align: center;
  }
  #stats-modal button {
    padding: 6px 20px; font-size: 14px; font-weight: 500;
    border: 0; border-radius: 6px; min-width: 120px;
    background: #3a5a40; color: #fff; cursor: pointer;
    transition: background .15s ease;
  }
  #stats-modal button:hover { background: #4c7454; }
  @keyframes stats-overlay-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes stats-panel-in {
    from { opacity: 0; transform: translateY(6px) scale(.97); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #stats-modal, #stats-modal .panel { animation: none; }
  }
</style>
</head>
<body>
<div id="toolbar">
  <button id="btn-new">🆕 Нова гра</button>
  <button id="btn-hint">💡 Підказка</button>
  <button id="btn-undo">↩️ Скасувати</button>
  <button id="btn-stats">📊 Статистика</button>
  <span id="status"></span>
  <span id="stats-summary"></span>
</div>
<div id="game-container"></div>
<div id="stats-modal">
  <div class="panel">
    <h2 id="stats-title">📊 Статистика</h2>
    <dl>
      <dt>📋 Зіграно партій</dt><dd id="stat-played">0</dd>
      <dt>🏆 Перемог</dt><dd id="stat-won">0</dd>
      <dt>📈 % перемог</dt><dd id="stat-winrate">0%</dd>
      <dt>🔥 Поточна серія</dt><dd id="stat-streak">0</dd>
      <dt>⭐ Рекордна серія</dt><dd id="stat-best-streak">0</dd>
      <dt>⏱️ Найкращий час</dt><dd id="stat-best-time">—</dd>
      <dt>💡 Підказок усього</dt><dd id="stat-hints-total">0</dd>
      <dt>↩️ Скасувань усього</dt><dd id="stat-undos-total">0</dd>
      <dt>🀄 Знято пар усього</dt><dd id="stat-pairs-total">0</dd>
    </dl>
    <div class="actions">
      <button id="btn-stats-close">✖ Закрити</button>
    </div>
  </div>
</div>
<script src="{% static 'vendor/phaser.min.js' %}"></script>
<script type="module" src="{% static 'game/main.js' %}"></script>
</body>
</html>
