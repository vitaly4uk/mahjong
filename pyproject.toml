[project]
name = "mahjong"
version = "0.1.0"
description = "Browser-based mahjong solitaire — Django + django-ninja server-authoritative backend, Phaser 3 frontend"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "brotli>=1.2.0",
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.1",
    "django-redis>=7.0.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["staticfiles", "**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
